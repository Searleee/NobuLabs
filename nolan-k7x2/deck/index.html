<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Becoming Whole · Masterclass presentation</title>
  <link rel="icon" href="../assets/img/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png" />
<link rel="stylesheet" href="../assets/funnel.css">
<!-- Engine: template/deck-scaffold.html (mechanics only). Design + copy below are Nolan's (system B). -->
<style>
  /* ---- engine mechanics (verbatim from the scaffold) ---- */
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{overflow:hidden}
  #stage{position:fixed;inset:0}
  .slide{position:absolute;inset:0;overflow:hidden}
  #bar{position:fixed;left:0;top:0;height:2px;background:var(--gold);opacity:.7;width:0;transition:width .3s ease;z-index:5}
  #counter{position:fixed;right:18px;bottom:14px;z-index:5;font:600 11px/1 var(--sans);color:var(--text-3);letter-spacing:.14em;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){#bar{transition:none}}

  /* ---- Nolan's deck system ---- */
  .sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7vh 7vw}
  .sl h2{font-size:clamp(28px,4.6vw,64px);line-height:1.1;max-width:22ch}
  .sl h2.xl{font-size:clamp(36px,6.4vw,92px);max-width:18ch}
  .sl h2 em,.sl h3 em{color:var(--gold-2)}
  .sl .sub{margin:3.2vh auto 0;max-width:46ch;color:var(--text-2);font-size:clamp(15px,1.6vw,22px);line-height:1.5}
  .sl .kick{font:700 clamp(10px,.95vw,13px)/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:3.4vh;display:inline-flex;gap:14px;align-items:center}
  .sl .kick::before,.sl .kick::after{content:"";width:26px;height:1px;background:currentColor;opacity:.55}
  .arcbg{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);pointer-events:none;
    background:repeating-radial-gradient(circle,transparent 0 5vmax,rgba(200,169,106,.06) 5vmax calc(5vmax + 1px));
    -webkit-mask-image:radial-gradient(circle,#000 0 18%,transparent 45%);mask-image:radial-gradient(circle,#000 0 18%,transparent 45%)}
  /* entrance */
  .a{opacity:0;transform:translateY(16px);animation:up .9s var(--ease) forwards;animation-delay:calc(var(--d,0) * 1s)}
  @keyframes up{to{opacity:1;transform:none}}
  .fade{opacity:0;animation:fd 1s ease forwards;animation-delay:calc(var(--d,0) * 1s)}
  @keyframes fd{to{opacity:1}}
  html.reduced .a,html.reduced .fade{animation:none;opacity:1;transform:none}

  /* divider */
  .div .num{font-family:var(--display);font-style:italic;font-size:clamp(70px,13vw,190px);line-height:1;color:var(--gold);opacity:.9}
  .div .step{font:700 12px var(--sans);letter-spacing:.36em;text-transform:uppercase;color:var(--text-3);margin-top:2vh}
  .div h2{margin-top:2vh}
  .div .rule{width:90px;height:1px;margin:3vh auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  /* photo layouts */
  .full img,.full .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .full::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,11,9,.92) 0,rgba(12,11,9,.6) 38%,rgba(12,11,9,0) 70%)}
  .full .cap{position:absolute;left:7vw;bottom:12vh;z-index:2;text-align:left;max-width:40vw}
  .full .cap h2{text-align:left;max-width:none}
  .full .cap .sub{margin-left:0;text-align:left}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:5vw;align-items:center;text-align:left}
  .split h2,.split .sub{text-align:left;margin-left:0}
  .frame{position:relative;width:100%;aspect-ratio:4/5;max-height:72vh;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 90px -40px #000}
  .frame img{width:100%;height:100%;object-fit:cover}
  .polaroid{background:#f2ede3;padding:14px 14px 56px;border-radius:4px;transform:rotate(-3deg);box-shadow:0 40px 80px -30px #000;max-width:min(38vw,440px);margin:0 auto}
  .polaroid img,.polaroid .ph{width:100%;aspect-ratio:1;object-fit:cover;display:block}
  .polaroid span{display:block;color:#3a332a;font:italic 400 clamp(14px,1.4vw,20px) var(--display);margin-top:12px;text-align:center}
  .ph.swap{display:grid;place-items:center;text-align:center;padding:24px;color:var(--text-3);font:700 11px/1.6 var(--sans);letter-spacing:.18em;text-transform:uppercase;
    background:repeating-linear-gradient(135deg,rgba(200,169,106,.05) 0 12px,transparent 12px 24px),var(--surface);border:1px dashed rgba(200,169,106,.4)}
  .frame .ph.swap{position:absolute;inset:0;border-radius:14px}
  .cluster{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw;width:min(80vw,1000px);margin-top:4vh}
  .cluster .ph{aspect-ratio:3/4;border-radius:10px}
  .art{width:min(32vw,46vh);aspect-ratio:1;border-radius:10px;box-shadow:0 40px 90px -30px #000,0 0 0 1px var(--line)}

  /* big number */
  .big{font-family:var(--display);font-size:clamp(80px,15vw,220px);line-height:.95;color:var(--text)}
  .big small{font-size:.32em;color:var(--gold-2);font-style:italic;margin-left:.15em}

  /* myth vs truth */
  .vs{display:grid;grid-template-columns:1fr auto 1fr;gap:3vw;align-items:stretch;width:min(86vw,1100px);margin-top:5vh}
  .vs .c{padding:4vh 2.6vw;border-radius:16px;border:1px solid var(--line);text-align:center}
  .vs .c .t{font:700 11px var(--sans);letter-spacing:.3em;text-transform:uppercase}
  .vs .c p{font-family:var(--display);font-size:clamp(18px,2.1vw,30px);line-height:1.3;margin:2vh 0 0}
  .vs .myth{opacity:.55}.vs .myth .t{color:var(--text-3)}.vs .myth p{text-decoration:line-through;text-decoration-color:rgba(200,169,106,.6);text-decoration-thickness:2px}
  .vs .truth{border-color:var(--gold);background:radial-gradient(90% 90% at 50% 0%,var(--gold-soft),transparent 70%)}.vs .truth .t{color:var(--gold)}
  .vs .mid{display:grid;place-items:center;font-family:var(--display);font-style:italic;color:var(--gold);font-size:22px}

  /* horizontal connected steps */
  .row{position:relative;display:flex;justify-content:center;gap:2vw;width:min(90vw,1200px);margin-top:6vh}
  .row::before{content:"";position:absolute;left:8%;right:8%;top:3.2vw;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6;transform-origin:left;animation:line 1.2s var(--ease) both}
  @keyframes line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  html.reduced .row::before{animation:none}
  .node{flex:1;max-width:220px}
  .node .o{position:relative;width:6.4vw;height:6.4vw;min-width:52px;min-height:52px;margin:0 auto 2.2vh;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:1px solid var(--gold);color:var(--gold-2);font-family:var(--display);font-style:italic;font-size:clamp(16px,1.7vw,24px)}
  .node .o svg{width:42%;height:42%}
  .node b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(15px,1.5vw,22px);line-height:1.25}
  .node span{display:block;margin-top:1vh;color:var(--text-2);font-size:clamp(12px,1.05vw,15px);line-height:1.45}

  /* cards / chips */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw;width:min(88vw,1150px);margin-top:5vh}
  .cardx{padding:3.6vh 1.8vw;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface));text-align:center}
  .cardx .i{font-family:var(--display);font-style:italic;color:var(--gold);font-size:18px}
  .cardx b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(17px,1.7vw,25px);margin-top:1.2vh;line-height:1.25}
  .cardx span{display:block;color:var(--text-2);font-size:clamp(12px,1.1vw,15px);margin-top:1vh;line-height:1.45}
  .cardx.on{border-color:var(--gold);background:radial-gradient(90% 90% at 50% 0%,var(--gold-soft),transparent 70%),var(--surface)}
  .chips{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:900px;margin-top:4vh}
  .chips span{padding:12px 18px;border:1px solid var(--line);border-radius:999px;font-size:clamp(13px,1.2vw,16px);background:rgba(12,11,9,.6)}

  /* stack */
  .stack{width:min(70vw,820px);margin-top:4vh;display:flex;flex-direction:column;gap:1.2vh}
  .stack div{display:flex;align-items:center;gap:18px;padding:1.8vh 22px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:clamp(14px,1.4vw,20px)}
  .stack div i{font-family:var(--display);color:var(--gold);width:28px}
  .stack div.new{border-color:var(--gold);background:radial-gradient(90% 140% at 0 0,var(--gold-soft),transparent 60%),var(--surface)}
  .stack div.dim{opacity:.55}
  .stack .flag{margin-left:auto;font:800 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold-ink);background:var(--gold);padding:5px 9px;border-radius:999px}

  /* engagement */
  .chat{display:inline-flex;align-items:center;gap:14px;margin-top:5vh;padding:16px 26px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:clamp(15px,1.5vw,20px)}
  .chat .dot{width:10px;height:10px;border-radius:50%;background:#e2584a;box-shadow:0 0 0 0 rgba(226,88,74,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 12px rgba(226,88,74,0)}100%{box-shadow:0 0 0 0 rgba(226,88,74,0)}}
  a.chat{color:inherit;text-decoration:none}
  .chat b{font-family:var(--display);font-size:1.4em;color:var(--gold-2)}

  /* demos */
  .bars{display:flex;align-items:flex-end;justify-content:center;gap:1vw;height:34vh;width:min(80vw,900px);margin-top:5vh;border-bottom:1px solid var(--line)}
  .bars div{flex:1;background:linear-gradient(180deg,var(--gold-2),var(--gold-deep));border-radius:6px 6px 0 0;height:0;animation:grow 1s var(--ease) forwards;animation-delay:calc(var(--d,0) * 1s);position:relative}
  .bars div span{position:absolute;bottom:-3.4vh;left:0;right:0;font:600 11px var(--sans);color:var(--text-3);letter-spacing:.1em}
  .bars div.off{background:rgba(242,237,227,.12)}
  @keyframes grow{to{height:var(--h)}}
  html.reduced .bars div{animation:none;height:var(--h)}
  .battery{width:min(46vw,520px);height:min(13vw,140px);border:2px solid var(--text-2);border-radius:18px;padding:10px;position:relative;margin-top:5vh}
  .battery::after{content:"";position:absolute;right:-16px;top:30%;width:10px;height:40%;background:var(--text-2);border-radius:0 4px 4px 0}
  .battery i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#c46a4a,var(--gold));width:100%;animation:drain 3.6s .6s ease-in forwards}
  @keyframes drain{to{width:6%}}
  html.reduced .battery i{animation:none;width:6%}
  .days{display:flex;gap:1.4vw;margin-top:2.4vh;justify-content:space-between;width:min(46vw,520px);font:700 12px var(--sans);letter-spacing:.2em;color:var(--text-3)}
  .loop{display:flex;align-items:center;gap:1.4vw;margin-top:6vh;flex-wrap:wrap;justify-content:center}
  .loop span{padding:14px 20px;border:1px solid var(--line);border-radius:999px;font-size:clamp(13px,1.3vw,18px);opacity:0;animation:up .6s var(--ease) forwards;animation-delay:calc(var(--d) * 1s)}
  .loop i{color:var(--gold);font-style:normal;opacity:0;animation:fd .4s forwards;animation-delay:calc(var(--d) * 1s)}
  html.reduced .loop span,html.reduced .loop i{animation:none;opacity:1}
  .page{width:min(52vw,640px);aspect-ratio:4/3;margin-top:4vh;border-radius:6px;padding:4vh 3vw;text-align:left;
    background:repeating-linear-gradient(180deg,transparent 0 calc(3.6vh - 1px),rgba(60,50,35,.18) calc(3.6vh - 1px) 3.6vh),#f2ede3;color:#2b251c;box-shadow:0 40px 90px -30px #000;transform:rotate(-1.5deg)}
  .page p{margin:0;font:italic 400 clamp(14px,1.6vw,22px)/3.6vh var(--display);overflow:hidden;white-space:nowrap;width:0;animation:type 1.4s steps(40) forwards;animation-delay:calc(var(--d) * 1s)}
  @keyframes type{to{width:100%}}
  html.reduced .page p{animation:none;width:100%}
  .heat{display:grid;grid-template-columns:70px repeat(7,1fr);gap:6px;width:min(70vw,860px);margin-top:5vh;font:600 11px var(--sans);color:var(--text-3);letter-spacing:.12em}
  .heat b{font-weight:600;display:grid;place-items:center}
  .heat i{aspect-ratio:1.6;border-radius:5px;background:rgba(242,237,227,.06);opacity:0;animation:fd .5s forwards;animation-delay:calc(var(--d) * 1s)}
  .heat i.h1{background:rgba(200,169,106,.3)}.heat i.h2{background:rgba(200,169,106,.75)}
  html.reduced .heat i{animation:none;opacity:1}
  .q2r{display:grid;grid-template-columns:1fr auto 1fr;gap:3vw;align-items:center;width:min(86vw,1100px);margin-top:5vh}
  .q2r .q{font-family:var(--display);font-style:italic;font-size:clamp(17px,2vw,28px);color:var(--text-2);line-height:1.35}
  .q2r .q small{display:block;margin-top:1.6vh;font:700 11px var(--sans);letter-spacing:.26em;text-transform:uppercase;font-style:normal;color:var(--text-3)}
  .q2r .arrow{font-size:28px;color:var(--gold)}
  .q2r .r{padding:3.4vh 2vw;border:1px solid var(--gold);border-radius:14px;font-family:var(--display);font-size:clamp(18px,2.1vw,30px);background:var(--gold-soft)}
  .q2r .r small{display:block;margin-bottom:1.4vh;font:700 11px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .code{width:min(46vw,560px);padding:5vh 3vw;border:1px solid var(--gold);border-radius:6px;background:var(--surface);text-align:left;box-shadow:0 0 0 8px rgba(200,169,106,.06),0 40px 90px -30px #000}
  .code h3{text-align:center;font-size:clamp(20px,2.2vw,30px);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3vh}
  .code ol{margin:0;padding-left:1.4em;font-family:var(--display);font-size:clamp(15px,1.6vw,22px);line-height:1.8}
  .code li::marker{color:var(--gold);font-style:italic}
  .seats{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;width:min(56vw,640px);margin-top:5vh}
  .seats i{aspect-ratio:1;border-radius:50%;border:1px solid var(--gold);opacity:0;animation:fd .3s forwards;animation-delay:calc(var(--d) * 1s)}
  .seats i.f{background:var(--gold)}
  html.reduced .seats i{animation:none;opacity:1}
  .timeline{display:flex;width:min(88vw,1150px);margin-top:6vh;position:relative}
  .timeline::before{content:"";position:absolute;left:0;right:0;top:9px;height:1px;background:var(--line)}
  .timeline div{flex:1;text-align:center;position:relative;padding-top:34px}
  .timeline div::before{content:"";position:absolute;left:50%;top:3px;width:13px;height:13px;margin-left:-6px;border-radius:50%;background:var(--bg);border:1px solid var(--gold)}
  .timeline div.on::before{background:var(--gold)}
  .timeline b{display:block;font:700 11px var(--sans);letter-spacing:.2em;color:var(--gold)}
  .timeline span{display:block;margin-top:1vh;font-size:clamp(12px,1.15vw,16px);color:var(--text-2);padding:0 6px;line-height:1.4}
  .room{position:relative;width:min(70vw,860px);height:34vh;margin-top:5vh;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
  .room .bed{position:absolute;left:6%;bottom:14%;width:30%;height:34%;border:1px solid var(--line);border-radius:10px}
  .room .bed::after{content:"Bed";position:absolute;inset:auto 0 -3.4vh;font:700 11px var(--sans);letter-spacing:.2em;color:var(--text-3);text-transform:uppercase}
  .room .desk{position:absolute;right:6%;bottom:14%;width:22%;height:22%;border:1px solid var(--line);border-radius:8px}
  .room .desk::after{content:"Across the room";position:absolute;inset:auto 0 -3.4vh;font:700 11px var(--sans);letter-spacing:.2em;color:var(--text-3);text-transform:uppercase;white-space:nowrap}
  .room .phone{position:absolute;left:30%;bottom:46%;width:3.2vw;min-width:26px;aspect-ratio:9/19;border-radius:6px;background:var(--gold);box-shadow:0 0 30px var(--gold-glow);animation:move 1.8s .8s var(--ease) forwards}
  @keyframes move{to{left:81%;bottom:38%}}
  html.reduced .room .phone{animation:none;left:81%;bottom:38%}
  .gift2{width:min(26vw,300px);border-radius:6px;box-shadow:0 40px 90px -30px #000,0 0 0 1px var(--line);transform:rotate(-4deg)}
  .gift2.blur{filter:blur(14px) brightness(.7)}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;width:min(80vw,960px);margin-top:5vh}
  .stat3 div{padding:4vh 1vw;border-top:1px solid var(--gold)}
  .stat3 b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(34px,4.6vw,66px);line-height:1}
  .stat3 span{display:block;margin-top:1.4vh;color:var(--text-2);font-size:clamp(12px,1.1vw,15px)}
  @media (max-width:760px){.split{grid-template-columns:1fr}.vs,.q2r{grid-template-columns:1fr}.vs .mid,.q2r .arrow{display:none}.cards,.stat3{grid-template-columns:1fr}.row{flex-wrap:wrap}.row::before{display:none}.full .cap{max-width:80vw}}
</style>

<body>
<div id="stage" aria-live="polite"></div>
<div id="bar"></div>
<div id="counter"></div>
<script>
/* ===== THE ENGINE (verbatim from template/deck-scaffold.html) ===== */
const DECK = (function(){
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) document.documentElement.classList.add('reduced');
  const stage = document.getElementById('stage');
  const bar = document.getElementById('bar');
  const counter = document.getElementById('counter');
  let current = 0, SLIDES = [];
  function show(i){
    if (!SLIDES.length) return;
    current = Math.max(0, Math.min(SLIDES.length - 1, i));
    const s = SLIDES[current];
    const el = document.createElement('section');
    el.className = 'slide';
    el.innerHTML = (typeof s === 'string') ? s : (s.html || '');
    stage.replaceChildren(el);
    if (s && typeof s.onMount === 'function') s.onMount(el, { reduced });
    bar.style.width = (current / Math.max(1, SLIDES.length - 1) * 100) + '%';
    counter.textContent = (current + 1) + ' / ' + SLIDES.length;
  }
  const next = () => show(current + 1);
  const prev = () => show(current - 1);
  addEventListener('keydown', e => {
    if (['ArrowRight',' ','Spacebar','PageDown'].includes(e.key)){ e.preventDefault(); next(); }
    else if (['ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); prev(); }
    else if (e.key === 'Home'){ show(0); }
    else if (e.key === 'End'){ show(SLIDES.length - 1); }
  });
  addEventListener('click', e => { if (e.target.closest('a')) return; (e.clientX < innerWidth * 0.33 ? prev : next)(); });
  function load(slides){ SLIDES = slides || []; const h = parseInt(location.hash.slice(1), 10); show(h ? h - 1 : 0); }
  return { load, show, next, prev, reduced };
})();

/* ===== slide builders (Nolan's system) ===== */
const IMG = '../assets/img/';
const d = (n) => `style="--d:${n}"`;
const swap = (t) => `<div class="ph swap">{{SWAP: ${t}}}</div>`;
const pic = (src, pos) => `<img src="${IMG}${src}" alt="" style="object-position:${pos||'50% 20%'}">`;
const S = {
  text: (kick, h, sub, xl) => `<div class="sl"><div class="arcbg"></div>${kick?`<div class="kick a">${kick}</div>`:''}<h2 class="a ${xl?'xl':''}" ${d(.1)}>${h}</h2>${sub?`<p class="sub a" ${d(.35)}>${sub}</p>`:''}</div>`,
  div: (num, step, h) => `<div class="sl div"><div class="arcbg"></div>${num?`<div class="num a">${num}</div>`:''}<div class="step a" ${d(.15)}>${step}</div><h2 class="a" ${d(.3)}>${h}</h2><div class="rule fade" ${d(.6)}></div></div>`,
  full: (img, h, sub, pos) => `<div class="full">${img.startsWith('SWAP')?swap(img.slice(5)):pic(img,pos)}<div class="cap"><h2 class="a">${h}</h2>${sub?`<p class="sub a" ${d(.25)}>${sub}</p>`:''}</div></div>`,
  framed: (img, h, sub, pos, flip) => `<div class="sl"><div class="split" style="width:min(86vw,1150px)">${flip?'':`<div class="frame a">${img.startsWith('SWAP')?swap(img.slice(5)):pic(img,pos)}</div>`}<div><h2 class="a" ${d(.15)}>${h}</h2>${sub?`<p class="sub a" ${d(.35)}>${sub}</p>`:''}</div>${flip?`<div class="frame a">${img.startsWith('SWAP')?swap(img.slice(5)):pic(img,pos)}</div>`:''}</div></div>`,

function countUp(el, { reduced }){

  });
}
